[package]
name = "nova-codegen-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Nova language's WebAssembly code generator (internal to the nova toolchain)"
readme = "../README.md"

[lib]
# Not a benchmark target: `cargo bench` would otherwise build this under
# libtest's harness, which rejects criterion's `--output-format`. The
# workspace's only benchmark is `nova-lexer/benches/lex.rs`.
bench = false

[dependencies]
nova-diagnostics = { workspace = true }
nova-mir = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
wasm-encoder = { workspace = true }

[dev-dependencies]
wasmparser = { workspace = true }
