[package]
name = "nova-driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compilation pipeline orchestration for Nova"

[lib]
# Not a benchmark target: `cargo bench` would otherwise build this under
# libtest's harness, which rejects criterion's `--output-format`. The
# workspace's only benchmark is `nova-lexer/benches/lex.rs`.
bench = false

[dependencies]
nova-diagnostics = { path = "../nova-diagnostics" }
nova-ast = { path = "../nova-ast" }
nova-lexer = { path = "../nova-lexer" }
nova-parser = { path = "../nova-parser" }
nova-resolver = { path = "../nova-resolver" }
nova-typeck = { path = "../nova-typeck" }
nova-hir = { path = "../nova-hir" }
nova-mir = { path = "../nova-mir" }
nova-codegen-cranelift = { path = "../nova-codegen-cranelift" }
nova-codegen-llvm = { path = "../nova-codegen-llvm" }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Test-only: the async end-to-end probe drives a JIT-compiled future through
# the real executor and reads the task's output back, which needs the runtime's
# own entry points. `nova-runtime` is already in the graph (via
# `nova-codegen-cranelift`), so this declares no new build, only visibility --
# and it is the same crate instance, which matters because the executor's task
# table is a `thread_local!` shared with the JIT-compiled code.
nova-runtime = { path = "../nova-runtime" }

[target.'cfg(windows)'.dependencies]
cc = { workspace = true }
