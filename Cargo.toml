[workspace]
members = ["crates/*", "std"]
resolver = "2"

[workspace.package]
# Every member's version. A release changes it together with the pins on
# the workspace's own crates below, the VS Code extension's package.json
# and package-lock.json, and Cargo.lock (spec
# docs/superpowers/specs/2026-10-12-phase-3-6a-release-preparation-design.md
# §3.2); nova-cli's tests/release_manifests.rs holds them to it.
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sakeerin/nova"
homepage = "https://github.com/Sakeerin/nova"

[workspace.dependencies]
# The 19 crates published to crates.io, for the normal and build
# dependencies between them (spec
# docs/superpowers/specs/2026-10-12-phase-3-6a-release-preparation-design.md
# §3.2). Each pin is exact and equals the version above: the crates are
# released together, and their APIs between each other are not kept
# stable, so nova-cli is never built against another release's
# nova-driver, even by a `cargo install` without `--locked`.
# Dev-dependencies stay `{ path = ... }`, which `cargo package` strips.
nova-ast = { path = "crates/nova-ast", version = "=0.2.0" }
nova-cli = { path = "crates/nova-cli", version = "=0.2.0" }
nova-codegen-cranelift = { path = "crates/nova-codegen-cranelift", version = "=0.2.0" }
nova-codegen-llvm = { path = "crates/nova-codegen-llvm", version = "=0.2.0" }
nova-diagnostics = { path = "crates/nova-diagnostics", version = "=0.2.0" }
nova-doc = { path = "crates/nova-doc", version = "=0.2.0" }
nova-driver = { path = "crates/nova-driver", version = "=0.2.0" }
nova-fmt = { path = "crates/nova-fmt", version = "=0.2.0" }
nova-hir = { path = "crates/nova-hir", version = "=0.2.0" }
nova-index = { path = "crates/nova-index", version = "=0.2.0" }
nova-lexer = { path = "crates/nova-lexer", version = "=0.2.0" }
nova-lsp = { path = "crates/nova-lsp", version = "=0.2.0" }
nova-mir = { path = "crates/nova-mir", version = "=0.2.0" }
nova-parser = { path = "crates/nova-parser", version = "=0.2.0" }
nova-pm = { path = "crates/nova-pm", version = "=0.2.0" }
nova-resolver = { path = "crates/nova-resolver", version = "=0.2.0" }
nova-runtime = { path = "crates/nova-runtime", version = "=0.2.0" }
nova-std = { path = "std", version = "=0.2.0" }
nova-typeck = { path = "crates/nova-typeck", version = "=0.2.0" }

# Parsing & errors
chumsky = "0.9"
ariadne = "0.4"
codespan-reporting = "0.11"
logos = "0.14"
thiserror = "1.0"
anyhow = "1.0"

# Compiler infra
indexmap = "2"
smol_str = "0.2"
rustc-hash = "1.1"

# Codegen (Phase 1: Cranelift debug backend)
cranelift = "0.105"
cranelift-module = "0.105"
cranelift-jit = "0.105"
cranelift-native = "0.105"
cranelift-object = "0.105"
cc = "1"

# Tooling
clap = { version = "4", features = ["derive"] }
rustyline = "14"

# Testing
insta = { version = "1", features = ["ron"] }
proptest = "1"
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The GitHub Contents API carries files as base64 (spec
# docs/superpowers/specs/2026-10-09-phase-3-3b-index-and-publishing-design.md
# §7). ureq already brings 0.22; it declares Rust 1.48.
base64 = "0.22"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The runtime library inside `nova`: nova-cli's build script compresses it,
# and nova-driver unpacks it (docs/adr/0027-runtime-and-std-in-an-installed-nova.md).
# flate2 is the standard gzip crate. 1.1.10 declares Rust 1.67, and it
# brings miniz_oxide 0.9, adler2 and simd-adler32, which declare no
# minimum, so the MSRV job is their check. All four are pure Rust, with no
# C build. crc32fast was already in the lockfile. Default features are off:
# flate2's `runtime_detection` names zlib-rs through a weak feature, which
# builds nothing but would still put zlib-rs in Cargo.lock.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.4"

# nova.toml (nova-pm). toml_edit's ImDocument keeps every key's and value's
# position, which the M-coded diagnostics need; it was already in the
# lockfile, through toml, and declares Rust 1.66. semver is the crate Cargo
# itself uses for versions and requirements; 1.0.28 declares Rust 1.68 and
# has no dependencies.
semver = "1"
toml_edit = "0.22"

# The language server (spec
# docs/superpowers/specs/2026-10-08-phase-3-2-lsp-core-design.md §6; ADR 0029).
# lsp-server is rust-analyzer's synchronous framing crate. It is pinned
# because 0.7.9 and every later release are edition 2024, which needs Rust
# 1.85, above the 1.78 MSRV; 0.7.8 is edition 2021 and brings
# crossbeam-channel and log. lsp-types 0.97.0 (edition 2018) holds the
# protocol's types and brings fluent-uri 0.1, bitflags 1 and serde_repr.
# Every crate these pull in declares Rust 1.71 or less, or nothing, so the
# MSRV job is their check.
lsp-server = "=0.7.8"
lsp-types = "0.97"

# `nova doc` renders `///` docs as Markdown (spec
# docs/superpowers/specs/2026-10-11-phase-3-5a-the-documentation-site-design.md
# §9.1; ADR 0034). pulldown-cmark is the CommonMark crate rustdoc and mdBook
# use. 0.13.4 declares Rust 1.71.1, and it is pinned so that `cargo update`
# cannot take a release with a higher minimum. Default features are off:
# they bring getopts, for its command-line tool. `html` brings
# pulldown-cmark-escape 0.11.0 (Rust 1.70). Its other dependencies are
# unicase 2.10.0, which declares no minimum and builds on 1.78 (checked
# 2026-10-11), and bitflags 2 and memchr, already locked.
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
