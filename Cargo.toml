[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/novalang/nova"

[workspace.dependencies]
# Parsing & errors
chumsky = "0.9"
ariadne = "0.4"
codespan-reporting = "0.11"
logos = "0.14"
thiserror = "1.0"
anyhow = "1.0"

# Compiler infra
indexmap = "2"
smol_str = "0.2"
rustc-hash = "1.1"

# Tooling
clap = { version = "4", features = ["derive"] }
rustyline = "14"

# Testing
insta = { version = "1", features = ["ron"] }
proptest = "1"
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
