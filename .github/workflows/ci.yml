name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every cargo invocation below passes `--locked` (except `cargo fmt`, which
# takes no such flag). `Cargo.lock` is tracked, and without `--locked` cargo
# silently rewrites it in place whenever it disagrees with a `Cargo.toml` --
# so a leg would quietly test a dependency set the lock does not describe,
# which is most of what committing the lock was meant to prevent. With it, a
# stale lock fails as "the lock file needs to be updated" instead.
#
# It matters most on the MSRV leg: cargo 1.78 predates the MSRV-aware
# resolver (1.84), so a fresh resolve there picks newest-compatible and dies
# parsing an `edition2024` manifest before any Nova source compiles. That is
# exactly how that leg was red before the lock was committed.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The Linux leg is pinned to `ubuntu-24.04`, whose `apt` has the
        # `clang` the golden suite through LLVM pins (ADR 0048).
        os: [ubuntu-24.04, windows-latest, macos-latest]
        include:
          - os: ubuntu-24.04
            require_clang: "1"
            clang: clang-18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The WASM target's tests run what they build under Node, and must not
      # pass without it (spec
      # docs/superpowers/specs/2026-10-14-phase-4-0-foundations-design.md
      # §9.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The golden suite through LLVM (`release_golden_suite`, spec
      # docs/superpowers/specs/2026-10-26-phase-5-0-the-language-and-std-a-compiler-needs-design.md
      # §3.2; ADR 0048) builds every golden program with `--release` through
      # Ubuntu's `clang-18`, pinned to 18.1.3. This step asserts the version,
      # not the test, so a local run with another `clang` still works; a
      # retired runner image moves the pin by a new ADR.
      - name: Install clang 18.1.3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          clang-18 --version
          if ! clang-18 --version | head -n 1 | grep -q 'version 18\.1\.3'; then
            echo "expected Ubuntu's clang 18.1.3; the pin in ADR 0048 needs to move"
            exit 1
          fi
      - name: cargo build
        run: cargo build --locked --workspace
      # On Linux, `NOVA_REQUIRE_CLANG=1` makes `release_golden_suite` run, and
      # fail if `clang-18` cannot; elsewhere it skips, and `NOVA_CLANG` is
      # the `clang` nova uses anyway.
      - name: cargo test
        env:
          NOVA_REQUIRE_NODE: "1"
          NOVA_REQUIRE_CLANG: ${{ matrix.require_clang || '0' }}
          NOVA_CLANG: ${{ matrix.clang || 'clang' }}
        run: cargo test --locked --workspace --all-features --no-fail-fast

      # std/, examples/ and selfhost/ stay in nova fmt's layout (spec
      # docs/superpowers/specs/2026-10-07-phase-3-1-formatter-design.md §8;
      # selfhost/ since 5.1a, ADR 0051). On Windows the checkout may hold
      # CRLF files, which nova fmt keeps.
      - name: nova fmt --check std examples selfhost
        run: cargo run --locked -q -p nova-cli -- fmt --check std examples selfhost

      # The eight `#[ignore]`d GC root tests are the only coverage of `PINNED`
      # actually being HONOURED by a real collection -- the registry could be
      # populated perfectly and ignored by the marker, and only these eight
      # would notice. The step above runs none of them.
      #
      # Note what this step is NOT the only guard for: that the executor
      # registers its root at all is covered unconditionally, on all three
      # legs, by nova-runtime's
      # `a_completed_tasks_state_stays_rooted_until_its_output_is_taken`, which
      # asserts on the registry directly and is neither ignored nor
      # Windows-gated. Deleting `gc::add_root` from `spawn` therefore fails the
      # step above, not this one.
      #
      # These eight assert on the outcome of a real, conservative stack scan
      # and intermittently over-retain (never a false free); see
      # docs/adr/0010-conservative-scan-root-test-gating.md for the mechanism
      # and the two remedies that were measured to make it worse.
      #
      # `continue-on-error` deliberately: a flake here must be visible without
      # red-lighting the pipeline, and a red-by-default job would just be
      # ignored. Deliberately NOT `--test-threads=1` -- serialization is one of
      # the two reverted remedies, and was measured to make this flakiness two
      # orders of magnitude worse.
      #
      # The eight run on all three legs. They were `#[cfg(windows)]` until
      # 2026-10-05, when `gc::stack_base` gained glibc Linux and macOS versions
      # (docs/adr/0024-gc-stack-bounds-on-unix.md). `--no-fail-fast` is what
      # lets them run on ubuntu: without it cargo stops after the first test
      # binary with a failure, and `extern_ffi_run` (ignored on Linux only,
      # issue #3) fails in `run_tests`, long before `nova-runtime`'s binary.
      # The job stays green either way, so count this step's `test result:`
      # lines, not its outcome.
      - name: cargo test (ignored GC scan tests; advisory, may flake)
        continue-on-error: true
        run: cargo test --locked --workspace --all-features --no-fail-fast -- --ignored

  # 4.2's and 4.3's gates in a real browser (spec
  # docs/superpowers/specs/2026-10-16-phase-4-2-std-dom-and-the-shim-design.md
  # §10.3, and 4.3's §9.4): the counters `cargo test` drives under the fake
  # DOM, one written with std/dom and one with std/ui, built for WASM and
  # clicked in Chromium through Playwright. Both have the ids `#add` and
  # `#count`, so one script clicks either. And 4.4's gate (§9.4):
  # `examples/06-counter-spa`, built from its project with its own page,
  # which `spa.mjs` clicks by its buttons' text. And 4.5's gate (spec
  # docs/superpowers/specs/2026-10-18-phase-4-5-router-and-nova-dev-design.md
  # §5.4): `dev.mjs` runs `06-counter-spa` under `nova dev`, edits it, breaks
  # it and fixes it; `router.mjs` drives `tests/browser/router-app`, in
  # history mode, under `nova dev`. Each copies its project into
  # `$RUNNER_TEMP` and kills `nova dev` at the end. And 4.6's gate (spec
  # docs/superpowers/specs/2026-10-19-phase-4-6-ssr-hydration-and-ssg-design.md
  # §9.5): `ssr.mjs` builds `tests/browser/ssr-app` with `nova build --ssg`
  # in `$RUNNER_TEMP`, starts its server on port 0, and checks that a
  # server-rendered page, and a page SSG wrote, served by a static server,
  # hydrate in place: the server's nodes stay, and a click updates them. It
  # kills the server at the end. And 4.7's gate (spec
  # docs/superpowers/specs/2026-10-21-phase-4-7-fullstack-blog-design.md
  # §7.5): `blog.mjs` builds `examples/07-fullstack-blog` with `nova build
  # --ssr` in `$RUNNER_TEMP`, sets its admin's password, starts its server
  # on port 0, and checks that every page hydrates in place, that the
  # comment form's checks and post work, that the admin creates, edits and
  # deletes a post, that a script in a title or a comment stays text, and
  # that a form without its CSRF token is refused; it kills the server at
  # the end. And 4.8's, Phase 4's gate measured (spec
  # docs/superpowers/specs/2026-10-22-phase-4-8-the-gate-and-v0.4.0-design.md
  # §3 and §4): 06 and 07 are built with `--release` and binaryen's
  # `wasm-opt`, which must run and shrink both clients, and `spa.mjs` and
  # `blog.mjs` drive those builds; `lighthouse.test.mjs` tests the rules
  # `lighthouse.mjs` applies, under `node --test`, without Lighthouse; and
  # `lighthouse.mjs` builds 06 and 07 in `$RUNNER_TEMP`, serves both on
  # port 0, runs Lighthouse three times, mobile, on 06's `/` and 07's `/`,
  # `/posts/1` and `/login`, fails when a run fails or a page's median
  # Performance score is under 95, and stops both servers at the end. The
  # release builds come before Lighthouse, so that a Lighthouse failure
  # does not hide their result, and the rules' test and Lighthouse run
  # after a failure of the release builds too, so that it does not hide
  # theirs. Playwright, Lighthouse and binaryen, each pinned, are installed
  # here only, into a scratch directory; nothing in `cargo test` or `nova`
  # installs a package. Ubuntu only: one browser job suffices.
  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `nova-runtime` too: cargo leaves `libnova_runtime.a` in
      # `target/debug/`, beside `nova`, only when the runtime is a package
      # the build names; as `nova-cli`'s dependency it stays in `deps/`. A
      # debug `nova` carries no runtime, and finds it there, to link the
      # native server `ssr.mjs` builds with `nova build --ssg`.
      - name: cargo build -p nova-cli -p nova-runtime
        run: cargo build --locked -p nova-cli -p nova-runtime
      - name: Build the counters for WASM
        run: |
          target/debug/nova build --target wasm tests/dom/counter.nova -o "$RUNNER_TEMP/counter"
          target/debug/nova build --target wasm tests/dom/ui_counter.nova -o "$RUNNER_TEMP/ui_counter"
          (cd examples/06-counter-spa && ../../target/debug/nova build --target wasm -o "$RUNNER_TEMP/counter-spa")
      - name: Install Playwright, Chromium, Lighthouse and binaryen
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 lighthouse@13.5.0 binaryen@132.0.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Click the counters in Chromium
        run: |
          node tests/browser/counter.mjs "$RUNNER_TEMP/counter" "$RUNNER_TEMP/pw"
          node tests/browser/counter.mjs "$RUNNER_TEMP/ui_counter" "$RUNNER_TEMP/pw"
          node tests/browser/spa.mjs "$RUNNER_TEMP/counter-spa" "$RUNNER_TEMP/pw"
      - name: nova dev and the router in Chromium
        run: |
          node tests/browser/dev.mjs target/debug/nova "$RUNNER_TEMP/dev" "$RUNNER_TEMP/pw"
          node tests/browser/router.mjs target/debug/nova "$RUNNER_TEMP/router" "$RUNNER_TEMP/pw"
      - name: SSR and SSG in Chromium
        run: node tests/browser/ssr.mjs target/debug/nova "$RUNNER_TEMP/ssr" "$RUNNER_TEMP/pw"
      - name: The blog in Chromium
        run: node tests/browser/blog.mjs target/debug/nova "$RUNNER_TEMP/blog" "$RUNNER_TEMP/pw"
      # binaryen's `wasm-opt` is on PATH in this step alone, so the other
      # steps build as `nova` does where there is none. `blog.mjs --release`
      # builds the server with `--release` too, through the runner's
      # `clang`. `shrank` compares each release `app.wasm` with the debug
      # build's the steps above drove.
      - name: Release builds with binaryen's wasm-opt
        id: release
        run: |
          export PATH="$RUNNER_TEMP/pw/node_modules/.bin:$PATH"
          wasm-opt --version
          (cd examples/06-counter-spa && ../../target/debug/nova build --target wasm --release -o "$RUNNER_TEMP/counter-spa-release")
          node tests/browser/spa.mjs "$RUNNER_TEMP/counter-spa-release" "$RUNNER_TEMP/pw" --release
          node tests/browser/blog.mjs target/debug/nova "$RUNNER_TEMP/blog-release" "$RUNNER_TEMP/pw" --release
          shrank() {
            debug=$(stat -c %s "$1/app.wasm")
            release=$(stat -c %s "$2/app.wasm")
            echo "$2/app.wasm: $release bytes, from $debug in the debug build"
            test "$release" -lt "$debug"
          }
          shrank "$RUNNER_TEMP/counter-spa" "$RUNNER_TEMP/counter-spa-release"
          shrank "$RUNNER_TEMP/blog/fullstack-blog/dist" "$RUNNER_TEMP/blog-release/fullstack-blog/dist"
      # The rules' test, and Lighthouse once the rules pass, run after a
      # failure of the release builds too, but not after an earlier step's:
      # `success()` is true while no step has failed, and the release step's
      # outcome is `failure` only when it ran and failed (a step skipped
      # after an earlier failure is `skipped`). `!cancelled()` keeps a
      # cancelled run from starting either.
      - name: The Lighthouse gate's rules
        id: rules
        if: success() || (!cancelled() && steps.release.outcome == 'failure')
        run: node --test tests/browser/lighthouse.test.mjs
      - name: Lighthouse on both examples
        if: steps.rules.outcome == 'success' && !cancelled()
        run: node tests/browser/lighthouse.mjs target/debug/nova "$RUNNER_TEMP/lighthouse" "$RUNNER_TEMP/pw"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Three legs, because a one-OS clippy is blind in both directions: an
  # ubuntu-only run never compiles a `#[cfg(windows)]` region
  # (`git grep -n '#\[cfg(windows)\]' -- '*.rs'` lists them), and anything
  # used only on Windows lints as dead there. Both halves have bitten this
  # project -- two of the five defects PR #2 fixed were Windows-only code
  # reading as dead on ubuntu, and three lints in `net.rs`'s Unix arm reached
  # CI on PR #8 because no local host runs Linux.
  #
  # The macos leg exists because `gc.rs`'s `stack_base` has a
  # `#[cfg(target_os = "macos")]` version that no other leg compiles
  # (2026-10-05, docs/adr/0024-gc-stack-bounds-on-unix.md).
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.78)
    runs-on: ubuntu-latest

    # `dtolnay/rust-toolchain@1.78` INSTALLS 1.78 and makes it the rustup
    # *default* -- and a `rust-toolchain.toml` in the repo root outranks the
    # default, so `cargo` here kept running `stable`. That is not a deduction
    # from rustup's precedence table; rustup says it itself in this job's own
    # log, in reply to the action's `rustup default 1.78.0`:
    #
    #     info: note that the toolchain 'stable-x86_64-unknown-linux-gnu' is
    #     currently in use (overridden by '.../nova/rust-toolchain.toml')
    #
    # So every green "MSRV (1.78)" before this comment landed checked the
    # workspace at `stable` and proved nothing about the published 1.78 floor.
    #
    # `RUSTUP_TOOLCHAIN` is an *environment* override, which outranks the file.
    # The action never sets it -- the only vars it writes to $GITHUB_ENV are
    # CARGO_HOME, CARGO_INCREMENTAL, CARGO_TERM_COLOR,
    # CARGO_REGISTRIES_CRATES_IO_PROTOCOL and CARGO_HTTP_MULTIPLEXING -- so
    # this job has to set it.
    env:
      # The one place this job's compiler is named. Write it as an exact
      # `x.y.z`: the guard step below compares `rustc --version` against this
      # literal, so a truncated or target-qualified value fails the job loudly
      # instead of quietly weakening it. `name:` above tracks it by hand.
      RUSTUP_TOOLCHAIN: "1.78.0"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2

      # A job called "MSRV (1.78)" that silently runs a different compiler is
      # worse than no job at all, because it reports success. This step is what
      # makes the name honest -- whatever the cause, now or the day someone
      # bumps `rust-toolchain.toml`, retargets the action, or deletes the
      # `env:` above. It runs BEFORE `cargo check` so that a mis-pinned job
      # fails on the pin itself rather than on a misleading pile of compile
      # errors, or on nothing at all.
      - name: Assert this job really runs the MSRV compiler
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          cargo --version
          actual="$(rustc --version | cut -d' ' -f2)"
          if [ "$actual" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "::error title=MSRV job is not running the MSRV compiler::rustc is $actual, expected $RUSTUP_TOOLCHAIN -- so this job's result says nothing about the 1.78 floor. Check whether rust-toolchain.toml or some other rustup override now outranks the RUSTUP_TOOLCHAIN env set on this job."
            exit 1
          fi
          echo "Confirmed: this job checks the workspace with rustc $actual."

      # Deliberately NOT `--all-targets`, which would additionally check tests,
      # benches and examples -- where an MSRV violation (a `reason = "..."` in
      # a lint attribute, say) still passes unnoticed today. Widening the
      # surface belongs here, but as its own commit: bundled with the pin above
      # it would conflate "the pin works now" with "the wider surface is
      # clean", and benches drag in criterion, whose own floor moves
      # independently of ours.
      # `-D warnings`, because an MSRV floor is about what 1.78 *accepts*, and
      # a lint 1.78 emits but stable does not is exactly the drift this job
      # exists to catch. It went in together with the one such warning in the
      # tree (`nova-parser`'s `grammar.rs`, an unused `ref e` binding): the
      # fix alone would have left nothing enforcing it, and the flag alone
      # would have been red on arrival. Measured before adding: with that one
      # line fixed, `RUSTFLAGS=-D warnings` at 1.78 is clean across the
      # workspace.
      - run: cargo check --locked --workspace
        env:
          RUSTFLAGS: -D warnings

  # The Phase 3.0 gate (spec
  # docs/superpowers/specs/2026-10-07-phase-3-0-foundations-design.md §8):
  # `nova`, installed with nothing beside it and no NOVA_ variable set,
  # makes, runs, builds and tests a new project. `cargo install` builds with
  # the release profile, so this is also the only job here that runs the
  # nested runtime build (nova-cli's build.rs); the jobs above build debug.
  install:
    name: Installed nova (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nova from this checkout
        shell: bash
        run: cargo install --locked --path crates/nova-cli --root "$RUNNER_TEMP/nova"
      - name: Nothing but nova was installed
        shell: bash
        run: |
          set -euo pipefail
          ls -A "$RUNNER_TEMP/nova/bin"
          case "$(ls -A "$RUNNER_TEMP/nova/bin")" in
            nova|nova.exe) ;;
            *) echo "::error::the install put more than nova into bin/"; exit 1 ;;
          esac
      # --node: the runner has `node`, so the WASM build must run under it
      # (spec
      # docs/superpowers/specs/2026-10-22-phase-4-8-the-gate-and-v0.4.0-design.md
      # §8).
      - name: The installed nova makes, runs, builds and tests a project
        shell: bash
        run: bash .github/scripts/gate.sh "$RUNNER_TEMP/nova/bin/nova" "$RUNNER_TEMP/gate" --test --node
      # The Phase 3.3a gate (spec
      # docs/superpowers/specs/2026-10-08-phase-3-3a-local-packages-design.md §8).
      - name: The installed nova builds a program against a path library
        shell: bash
        run: bash .github/scripts/packages-gate.sh "$RUNNER_TEMP/nova/bin/nova" "$RUNNER_TEMP/packages"
      # The Phase 3.5a gate (spec
      # docs/superpowers/specs/2026-10-11-phase-3-5a-the-documentation-site-design.md
      # §17): its installed half; the anchors and links are the Test job's.
      # And the 3.5b gate's (spec
      # docs/superpowers/specs/2026-10-11-phase-3-5b-doc-tests-design.md
      # §13): the example library's doc tests pass.
      - name: The installed nova documents an example that uses a dependency, and runs its doc tests
        shell: bash
        run: bash .github/scripts/doc-gate.sh "$RUNNER_TEMP/nova/bin/nova" "$RUNNER_TEMP/doc"
      # The Phase 3.3b gate (spec
      # docs/superpowers/specs/2026-10-09-phase-3-3b-index-and-publishing-design.md
      # §11.1): a local index only; CI never writes the real one.
      - name: The installed nova publishes to a local index and builds from it
        shell: bash
        run: bash .github/scripts/registry-gate.sh "$RUNNER_TEMP/nova/bin/nova" "$RUNNER_TEMP/registry"
      - name: std survives packaging
        run: cargo package -p nova-std --locked

  # The package route (spec
  # docs/superpowers/specs/2026-10-12-phase-3-6a-release-preparation-design.md
  # §4): the 20 crates crates.io will get package and verify, their
  # lockfiles agree with the workspace's, and a `nova` installed from the
  # packages, as `cargo install nova-cli` installs from crates.io, embeds
  # its runtime and passes the Phase 3.0 gate. The install job above
  # installs from the checkout; this one from what would be uploaded.
  package:
    name: Packaged nova (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package the 20 crates, install nova from them, run the gate
        shell: bash
        run: bash .github/scripts/package-gate.sh "$RUNNER_TEMP/package-gate"

  # The VS Code extension (spec
  # docs/superpowers/specs/2026-10-08-phase-3-2-lsp-core-design.md §8): it
  # is platform-neutral, and the Rust gate test drives `nova lsp` on all
  # three systems, so one Linux job suffices. The smoke test runs VS Code
  # 1.91.0, the extension's floor, under a virtual display.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build -p nova-cli
        run: cargo build --locked -p nova-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-nova/package-lock.json
      - name: npm ci
        working-directory: tools/vscode-nova
        run: npm ci
      - name: Compile
        working-directory: tools/vscode-nova
        run: npm run compile
      - name: Smoke test
        working-directory: tools/vscode-nova
        run: xvfb-run -a npm test
      - name: Package the .vsix
        working-directory: tools/vscode-nova
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          npx vsce package --out "nova-vscode-$version.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: tools/vscode-nova/*.vsix
          if-no-files-found: error
