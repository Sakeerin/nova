name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features

      # The eight `#[ignore]`d GC root tests are the ONLY coverage of
      # `gc::add_root` being wired into the executor's spawn path, and the step
      # above runs none of them -- so without this step, deleting that call
      # from `spawn` is killed by nothing CI executes at all. They assert on
      # the outcome of a real, conservative stack scan and intermittently
      # over-retain (never a false free); see
      # docs/adr/0010-conservative-scan-root-test-gating.md for the mechanism
      # and the two remedies that were measured to make it worse.
      #
      # `continue-on-error` deliberately: a flake here must be visible without
      # red-lighting the pipeline, and a red-by-default job would just be
      # ignored. Deliberately NOT `--test-threads=1` -- serialization is one of
      # the two reverted remedies, and was measured to make this flakiness two
      # orders of magnitude worse.
      #
      # All eight are `#[cfg(windows)]`, so this filters to zero tests on the
      # ubuntu and macos legs. That is intentional rather than a matrix
      # exclusion: the day `gc::stack_base` grows a non-Windows implementation,
      # this step starts covering them everywhere with no CI change.
      - name: cargo test (ignored GC scan tests; advisory, may flake)
        continue-on-error: true
        run: cargo test --workspace --all-features -- --ignored

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.78)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
