name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every cargo invocation below passes `--locked` (except `cargo fmt`, which
# takes no such flag). `Cargo.lock` is tracked, and without `--locked` cargo
# silently rewrites it in place whenever it disagrees with a `Cargo.toml` --
# so a leg would quietly test a dependency set the lock does not describe,
# which is most of what committing the lock was meant to prevent. With it, a
# stale lock fails as "the lock file needs to be updated" instead.
#
# It matters most on the MSRV leg: cargo 1.78 predates the MSRV-aware
# resolver (1.84), so a fresh resolve there picks newest-compatible and dies
# parsing an `edition2024` manifest before any Nova source compiles. That is
# exactly how that leg was red before the lock was committed.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked --workspace
      - name: cargo test
        run: cargo test --locked --workspace --all-features --no-fail-fast

      # The eight `#[ignore]`d GC root tests are the only coverage of `PINNED`
      # actually being HONOURED by a real collection -- the registry could be
      # populated perfectly and ignored by the marker, and only these eight
      # would notice. The step above runs none of them.
      #
      # Note what this step is NOT the only guard for: that the executor
      # registers its root at all is covered unconditionally, on all three
      # legs, by nova-runtime's
      # `a_completed_tasks_state_stays_rooted_until_its_output_is_taken`, which
      # asserts on the registry directly and is neither ignored nor
      # Windows-gated. Deleting `gc::add_root` from `spawn` therefore fails the
      # step above, not this one.
      #
      # These eight assert on the outcome of a real, conservative stack scan
      # and intermittently over-retain (never a false free); see
      # docs/adr/0010-conservative-scan-root-test-gating.md for the mechanism
      # and the two remedies that were measured to make it worse.
      #
      # `continue-on-error` deliberately: a flake here must be visible without
      # red-lighting the pipeline, and a red-by-default job would just be
      # ignored. Deliberately NOT `--test-threads=1` -- serialization is one of
      # the two reverted remedies, and was measured to make this flakiness two
      # orders of magnitude worse.
      #
      # All eight are `#[cfg(windows)]`, so this filters to zero tests on the
      # ubuntu and macos legs. That is intentional rather than a matrix
      # exclusion: the day `gc::stack_base` grows a non-Windows implementation,
      # this step starts covering them everywhere with no CI change.
      - name: cargo test (ignored GC scan tests; advisory, may flake)
        continue-on-error: true
        run: cargo test --locked --workspace --all-features -- --ignored

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Two legs, because a one-OS clippy is blind in both directions: an
  # ubuntu-only run never compiles the 33 `#[cfg(windows)]` regions across 7
  # files, and anything used only on Windows lints as dead there. Both halves
  # have bitten this project -- two of the five defects PR #2 fixed were
  # Windows-only code reading as dead on ubuntu, and three lints in
  # `net.rs`'s Unix arm reached CI on PR #8 because no local host runs Linux.
  #
  # No macos leg: the tree has no `target_os = "macos"` or `target_vendor =
  # "apple"` cfg at all, so macos would lint exactly what ubuntu does.
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.78)
    runs-on: ubuntu-latest

    # `dtolnay/rust-toolchain@1.78` INSTALLS 1.78 and makes it the rustup
    # *default* -- and a `rust-toolchain.toml` in the repo root outranks the
    # default, so `cargo` here kept running `stable`. That is not a deduction
    # from rustup's precedence table; rustup says it itself in this job's own
    # log, in reply to the action's `rustup default 1.78.0`:
    #
    #     info: note that the toolchain 'stable-x86_64-unknown-linux-gnu' is
    #     currently in use (overridden by '.../nova/rust-toolchain.toml')
    #
    # So every green "MSRV (1.78)" before this comment landed checked the
    # workspace at `stable` and proved nothing about the published 1.78 floor.
    #
    # `RUSTUP_TOOLCHAIN` is an *environment* override, which outranks the file.
    # The action never sets it -- the only vars it writes to $GITHUB_ENV are
    # CARGO_HOME, CARGO_INCREMENTAL, CARGO_TERM_COLOR,
    # CARGO_REGISTRIES_CRATES_IO_PROTOCOL and CARGO_HTTP_MULTIPLEXING -- so
    # this job has to set it.
    env:
      # The one place this job's compiler is named. Write it as an exact
      # `x.y.z`: the guard step below compares `rustc --version` against this
      # literal, so a truncated or target-qualified value fails the job loudly
      # instead of quietly weakening it. `name:` above tracks it by hand.
      RUSTUP_TOOLCHAIN: "1.78.0"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: Swatinem/rust-cache@v2

      # A job called "MSRV (1.78)" that silently runs a different compiler is
      # worse than no job at all, because it reports success. This step is what
      # makes the name honest -- whatever the cause, now or the day someone
      # bumps `rust-toolchain.toml`, retargets the action, or deletes the
      # `env:` above. It runs BEFORE `cargo check` so that a mis-pinned job
      # fails on the pin itself rather than on a misleading pile of compile
      # errors, or on nothing at all.
      - name: Assert this job really runs the MSRV compiler
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc --version
          cargo --version
          actual="$(rustc --version | cut -d' ' -f2)"
          if [ "$actual" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "::error title=MSRV job is not running the MSRV compiler::rustc is $actual, expected $RUSTUP_TOOLCHAIN -- so this job's result says nothing about the 1.78 floor. Check whether rust-toolchain.toml or some other rustup override now outranks the RUSTUP_TOOLCHAIN env set on this job."
            exit 1
          fi
          echo "Confirmed: this job checks the workspace with rustc $actual."

      # Deliberately NOT `--all-targets`, which would additionally check tests,
      # benches and examples -- where an MSRV violation (a `reason = "..."` in
      # a lint attribute, say) still passes unnoticed today. Widening the
      # surface belongs here, but as its own commit: bundled with the pin above
      # it would conflate "the pin works now" with "the wider surface is
      # clean", and benches drag in criterion, whose own floor moves
      # independently of ours.
      # `-D warnings`, because an MSRV floor is about what 1.78 *accepts*, and
      # a lint 1.78 emits but stable does not is exactly the drift this job
      # exists to catch. It went in together with the one such warning in the
      # tree (`nova-parser`'s `grammar.rs`, an unused `ref e` binding): the
      # fix alone would have left nothing enforcing it, and the flag alone
      # would have been red on arrival. Measured before adding: with that one
      # line fixed, `RUSTFLAGS=-D warnings` at 1.78 is clean across the
      # workspace.
      - run: cargo check --locked --workspace
        env:
          RUSTFLAGS: -D warnings
